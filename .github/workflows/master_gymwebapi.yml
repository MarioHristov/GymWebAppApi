name: Build and test GymWebApi
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish GymWebApi/GymWebApi.csproj -c Release -o "$RUNNER_TEMP/app"
      - name: Test member workflows
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5267
        run: |
          cd "$RUNNER_TEMP/app"
          dotnet GymWebApi.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          service=$!
          trap 'kill "$service"' EXIT
          cd "$GITHUB_WORKSPACE"
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS "$ASPNETCORE_URLS/api/clubs" > /dev/null
          python3 tests/workflow.py "$ASPNETCORE_URLS"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: gym-api
          path: |
            ${{ runner.temp }}/app
            !${{ runner.temp }}/app/*.db*
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gym-api
      - uses: azure/webapps-deploy@v3
        with:
          app-name: GymWebApi
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BCBEB0240C7247B0821965065AB460E7 }}
          package: .
